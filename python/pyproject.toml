[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The distribution installs as `firecrawl-anydoc` (the bare `anydoc` name on
# PyPI is held by an unrelated package) and imports as `anydoc`.
[project]
name = "firecrawl-anydoc"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["markdown", "docx", "pdf", "pptx", "xlsx", "epub", "converter", "document"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
# The version comes from Cargo.toml `package.version`.
dynamic = ["version"]

# Optional: `ocr="reject"` (the default) recovers pages via Azure Document
# Intelligence instead of raising, when AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
# and _KEY are set. Kept optional so the base install stays dependency-free
# for everyone not using it.
#
# `pdf-inspector` is pinned to the same fork tag `Cargo.toml`'s
# `[patch.crates-io]` redirects the crate to, and for the same reason. This
# package is consumed twice: the Rust core links the crate, and `_parse_azure`
# imports the Python package. A plain version constraint here resolves the
# second one from PyPI -- upstream, without the fork's RTL fix -- so the two
# halves of one install disagreed, and Hebrew came back character-reversed
# from whichever path went through Python. Keeping both on one tag is what
# stops that. Move them together.
#
# The git URL must not reach upstream: PyPI rejects packages whose
# dependencies carry direct references, so this line would break their
# release. It is safe here only because this whole extra is fork-added --
# upstream has no `[project.optional-dependencies]` at all.
[project.optional-dependencies]
azure = [
    "azure-ai-documentintelligence>=1.0.2",
    "pdf-inspector @ git+https://github.com/SaarBarak/pdf-inspector.git@v1.17.0-rtl-fix.2",
    "pypdf>=5.0",
]

[project.urls]
Homepage = "https://github.com/firecrawl/anydoc#readme"
Repository = "https://github.com/firecrawl/anydoc"
Issues = "https://github.com/firecrawl/anydoc/issues"

[tool.maturin]
module-name = "anydoc._anydoc"
