[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The distribution installs as `firecrawl-anydoc` (the bare `anydoc` name on
# PyPI is held by an unrelated package) and imports as `anydoc`.
[project]
name = "firecrawl-anydoc"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["markdown", "docx", "pdf", "pptx", "xlsx", "epub", "converter", "document"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
# The version comes from Cargo.toml `package.version`.
dynamic = ["version"]

# Optional: `ocr="reject"` (the default) recovers pages through a configured
# OCR engine instead of raising. Kept optional so the base install stays
# dependency-free for everyone not using it.
#
# `ocr` is what the dispatch itself needs, independent of engine: slicing one
# page out of the document to send. Every engine needs it, so it does not
# belong to any one engine's extra. An engine extra is that engine's SDK plus
# this.
#
# `pdf-inspector` is deliberately absent. Reading a PDF's per-page state goes
# through anydoc's own bindings (`pdf_pages_markdown`), against the crate the
# root `[patch.crates-io]` already redirects to the fork. Installing it here as
# a second Python package would resolve it independently of that crate, which
# is exactly how one install ended up carrying two versions of one library --
# the crate with the RTL fix, the Python package without it -- and Hebrew came
# back character-reversed from whichever path went through Python.
#
# It also keeps a `git+` direct reference out of this file. PyPI rejects
# packages whose dependencies carry one, so a pin here could never go upstream.
[project.optional-dependencies]
ocr = [
    "pypdf>=5.0",
]
azure = [
    "firecrawl-anydoc[ocr]",
    "azure-ai-documentintelligence>=1.0.2",
]

[project.urls]
Homepage = "https://github.com/firecrawl/anydoc#readme"
Repository = "https://github.com/firecrawl/anydoc"
Issues = "https://github.com/firecrawl/anydoc/issues"

[tool.maturin]
module-name = "anydoc._anydoc"
