# The wheel version: pyproject.toml reads `version` from here (maturin's
# dynamic version), so bump it together with the workspace release version.
[package]
name = "anydoc-python"
version = "0.2.4"
edition = "2024"
description = "Python bindings for anydoc"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anydoc = { path = ".." }
# The same crate anydoc's PDF backend already links, and the root
# `[patch.crates-io]` redirects both to the RTL-fixed fork. Depending on it
# here is what lets the Python layer read a PDF's per-page state through
# these bindings instead of installing `pdf-inspector` as a second, separately
# resolved Python package — which is how the two ended up on different
# versions, with Hebrew coming back reversed from the Python side.
pdf-inspector = "1.14.2"
# abi3-py310 pins the stable ABI: one wheel per platform covers every
# CPython from 3.10 up.
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
